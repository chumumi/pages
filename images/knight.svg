<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Neck -->
  <rect x="85" y="60" width="30" height="40" fill="#32B840" stroke="#1a1a1a" stroke-width="3" rx="5"/>
  
  <!-- Head (horse shape) -->
  <path d="M 100 50 L 120 60 L 130 80 L 120 100 L 80 100 L 70 80 L 80 60 Z" 
        fill="#32B840" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Ear -->
  <polygon points="85,50 95,35 105,50" fill="#32B840" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Eye -->
  <circle cx="100" cy="75" r="4" fill="#1a1a1a"/>
  
  <!-- Mouth -->
  <path d="M 85 85 Q 100 95 115 85" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Base -->
  <rect x="70" y="140" width="60" height="40" fill="#32B840" stroke="#1a1a1a" stroke-width="3" rx="3"/>
</svg>
